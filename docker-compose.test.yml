# Base de datos de TEST para la suite de PHPUnit (solo desarrollo).
# MariaDB con el esquema de tpvfox cargado automáticamente y datos en tmpfs
# (efímera: cada arranque parte de un estado limpio y reproducible).
#
# Uso:
#   docker compose -f docker-compose.test.yml up -d
#   nix-shell --run 'composer test'      # desde repos/tpvfox
#   docker compose -f docker-compose.test.yml down
services:
  db-test:
    image: mariadb:11
    container_name: tpvfox-test-db
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: tpvfox_test
      MARIADB_USER: tpvfox_test
      MARIADB_PASSWORD: tpvfox_test
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      # El dump se ejecuta una sola vez al inicializar la BD.
      - ./BD/BDtpv/tpvfox_V_0_3-1.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 20
